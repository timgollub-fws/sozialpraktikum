<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sozialpraktikum der 11. Klasse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #222;
      --line: #c9c9c9;
      --soft: #f3f4f2;
      --accent: #33463a;
      --paper: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: #e9e9e9;
      font-family: "Source Sans 3", sans-serif;
      font-size: 10.4pt;
      line-height: 1.35;
      hyphens: auto;
    }

    .print-page {
      width: 210mm;
      height: 297mm;
      margin: 12mm auto;
      padding: 15mm 18mm 14mm;
      background: var(--paper);
      box-shadow: 0 2mm 8mm rgba(0, 0, 0, .12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1.5px solid var(--accent);
      padding-bottom: 4mm;
      margin-bottom: 5mm;
    }

    h1 {
      margin: 0;
      font-family: "Lora", serif;
      font-size: 21pt;
      line-height: 1.1;
      font-weight: 600;
      color: var(--accent);
    }

    .subtitle {
      margin: 1.5mm 0 0;
      color: var(--ink);
      font-size: 10.5pt;
    }

    .school-logo {
      width: 35mm;
      height: auto;
      object-fit: contain;
    }

    .small-page-header {
      font-size: 8.5pt;
      color: #666;
      border-bottom: 1px solid var(--line);
      padding-bottom: 2mm;
      margin-bottom: 4mm;
    }

    .page-content {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    .page-footer {
      display: flex;
      justify-content: space-between;
      flex: 0 0 auto;
      min-height: 6mm;
      margin-top: 3mm;
      padding-top: 2mm;
      border-top: 1px solid var(--line);
      color: #666;
      font-size: 8.5pt;
    }

    .country {
      break-inside: avoid;
      margin: 0 0 6mm;
    }

    .country-head {
      margin: 0;
    }

    h2 {
      margin: 5mm 0 2mm;
      font-family: "Lora", serif;
      font-size: 12.5pt;
      line-height: 1.2;
      font-weight: 600;
      color: var(--accent);
      break-after: avoid;
      page-break-after: avoid;
    }

    .country-note {
      margin: 0 0 3mm;
      font-size: 9.5pt;
    }

    .entry-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .entry {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 16mm;
      gap: 4mm;
      align-items: center;
      padding: 2.5mm 0;
      border-bottom: 1px solid var(--line);
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .entry-name {
      font-weight: 700;
    }

    .practice-note {
      display: inline;
      margin-left: 1mm;
      padding: .3mm 1.4mm;
      border: 1px solid var(--accent);
      border-radius: 2mm;
      color: var(--accent);
      font-size: 8pt;
      line-height: 1.2;
      vertical-align: middle;
    }

    .entry-url {
      display: block;
      margin-top: .7mm;
      font-size: 8.5pt;
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .qr {
      width: 16mm;
      height: 16mm;
      image-rendering: crisp-edges;
      visibility: hidden;
    }

    @media print {
      @page {
        size: A4;
        margin: 0;
      }

      body {
        background: white;
      }

      .print-page {
        width: 210mm;
        height: 297mm;
        margin: 0;
        padding: 15mm 18mm 14mm;
        box-shadow: none;
        break-after: page;
        page-break-after: always;
      }

      .print-page:last-child {
        break-after: auto;
        page-break-after: auto;
      }

      h1 {
        font-size: 20pt;
      }

      h2 {
        font-size: 14pt;
      }

      .country {
        page-break-inside: avoid;
      }

      .qr {
        width: 16mm;
        height: 16mm;
        visibility: visible;
      }
    }

    @media (max-width: 760px) {
      .print-page {
        width: 100%;
        min-height: 100vh;
        height: auto;
        padding: 16px;
      }

      .entry {
        grid-template-columns: minmax(0, 1fr) 15mm;
      }

      .qr {
        width: 15mm;
        height: 15mm;
      }
    }
  </style>
</head>

    const selectedCountries = [
      // UK und Irland
      ["Vereinigtes Königreich - Schottland", "Schottland"],
      ["Vereinigtes Königreich - Nordirland", "Nordirland"],
      ["Vereinigtes Königreich - England", "England"],
      ["Irland", "Irland"],

      // Skandinavien
      ["Schweden", "Schweden"],
      ["Finnland", "Finnland"],
      ["Norwegen", "Norwegen"],

      // Westlich von Deutschland
      ["Portugal", "Portugal"],
      ["Niederlande", "Niederlande"],
      ["Frankreich", "Frankreich"],

      // Östlich von Deutschland
      ["Estland", "Estland"],
      ["Türkei", "Türkei"],
      ["Tschechien", "Tschechien"],
      ["Ungarn", "Ungarn"],
      ["Lettland", "Lettland"],
      ["Litauen", "Litauen"],
      ["Polen", "Polen"],
      ["Russland", "Russland"],

      // Übersee
      ["USA", "USA"],
      ["Südafrika", "Südafrika"],

      // Schweiz und Deutschland
      ["Schweiz", "Schweiz"],
      ["Deutschland", "Deutschland"],
    ].map(([sourceName, displayName]) => {
      const country = allCountries.find(({ name }) => name === sourceName);
      if (sourceName === "Irland") {
        return {
          name: displayName,
          entries: [],
          note: "Irische Camphills können derzeit leider keine internationalen Freiwilligen aufnehmen.",
        };
      }
      if (sourceName === "Norwegen") {
        return {
          ...country,
          name: displayName,
          note: "Für einen Aufenthalt sind Norwegischkenntnisse erforderlich.",
        };
      }
      if (sourceName === "Türkei") {
        return {
          name: displayName,
          entries: [["Kindergarten Her Çocuk Bir Evren", "https://www.hercocukbirevren.com"]],
        };
      }
      if (sourceName === "USA") {
        return {
          ...country,
          name: displayName,
          entries: country.entries.filter(([name]) => name === "Plowshare Farm"),
        };
      }
      if (sourceName === "Frankreich") {
        return {
          ...country,
          name: displayName,
          note: "Für einen Aufenthalt sind gute Französischkenntnisse erforderlich.",
        };
      }
      if (sourceName === "Vereinigtes Königreich - England") {
        return {
          ...country,
          name: displayName,
          entries: [],
          note: "Wir prüfen derzeit, welche Camphills in England und Wales Schüler*innen aufnehmen.",
        };
      }
      return country ? { ...country, name: displayName } : { name: displayName, entries: [] };

      "Community Mourne Grange",

      "Kindergarten Her Çocuk Bir Evren",
      "Camphill Häggatorp",

      "Garvald West Linton",
      "Pahkla Camphilli Küla",
      "Camphill Oberdorf",
      "Stiftung Humanus-Haus",
      "Newton Dee Village",

      "Newton Dee Village",
      "Vallersund Gård",
      "Stiftung Humanus-Haus",
      "Camphill Oberdorf",
      "Kindergarten Her Çocuk Bir Evren",
      "Plowshare Farm",
      "Pahkla Camphilli Küla",
    ]);

    function qrUrl(url) {
      return "https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=8&data=" + encodeURIComponent(url);
    }

    function createPage(root, firstPage) {
      const page = document.createElement("section");
      page.className = "print-page";
      page.innerHTML = firstPage
        ? `
          <header>
            <div>
              <h1>Sozialpraktikum der 11. Klasse</h1>
              <p class="subtitle">Camphill-Einrichtungen</p>
            </div>
            <img src="welle-oben.png" class="school-logo" alt="">
          </header>
          <div class="page-content"></div>
          <footer class="page-footer"></footer>
        `
        : `
          <div class="small-page-header">Sozialpraktikum · 11. Klasse · Camphill-Einrichtungen</div>
          <div class="page-content"></div>
          <footer class="page-footer"></footer>
        `;
      root.appendChild(page);
      return page.querySelector(".page-content");
    }

    function createCountryHeading(name) {
      const heading = document.createElement("h2");
      heading.textContent = name;
      return heading;
    }

    function createEntry(name, url) {
      const item = document.createElement("li");
      item.className = "entry";
      item.innerHTML = `
        <div>
          <div class="entry-name">${name}${placements2025.has(name) ? '<span class="practice-note">2025</span>' : ""}${placements2026.has(name) ? '<span class="practice-note">2026</span>' : ""}</div>
          <a class="entry-url" href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>
        </div>
        <img class="qr" src="${qrUrl(url)}" alt="QR-Code zu ${name}">
      `;
      return item;
    }

    function render() {
      const root = document.getElementById("content");
      root.innerHTML = "";
      let pageContent = createPage(root, true);

      selectedCountries.forEach((country) => {
        let heading = createCountryHeading(country.name);
        let list = document.createElement("ul");
        list.className = "entry-list";
        pageContent.append(heading);
        let note;
        if (country.note) {
          note = document.createElement("p");
          note.className = "country-note";
          note.textContent = country.note;
          pageContent.append(note);
        }
        pageContent.append(list);

        country.entries.forEach(([name, url]) => {
          const item = createEntry(name, url);
          list.appendChild(item);

          if (pageContent.scrollHeight > pageContent.clientHeight) {
            item.remove();
            if (list.children.length === 0) {
              heading.remove();
              note?.remove();
              list.remove();
            }

            pageContent = createPage(root, false);
            heading = createCountryHeading(country.name);
            list = document.createElement("ul");
            list.className = "entry-list";
            pageContent.append(heading);
            if (country.note) {
              note = document.createElement("p");
              note.className = "country-note";
              note.textContent = country.note;
              pageContent.append(note);
            }
            pageContent.append(list);
            list.appendChild(item);
          }
        });
      });

      const pages = root.querySelectorAll(".print-page");
      pages.forEach((page, index) => {
        page.querySelector(".page-footer").innerHTML = `
          <span>Stand: 1. September 2026</span>
          <span>Seite ${index + 1} von ${pages.length}</span>
        `;
      });
    }

    if (document.fonts) {
      document.fonts.ready.then(render);
    } else {
      render();
    }
  </script>
</body>
</html>
